# Snowflake order transfer (appendix): train on orders 4-6, evaluate on the
# never-seen orders 7-10. Also the 0-puzzle row of the mix-in sweep
# (ood_4to6_mixin*.yaml).
# Varied-topology dataset, 500 training puzzles, 4K steps (the budget the
# archived order-transfer runs used; Table 2 uses 1K). Everything not set
# here is the paper recipe (paper.yaml).
name: ood_4to6_eval7to10

data:
  train_orders: [4, 5, 6]

train:
  steps: 4000

eval:
  index_filter: {orders: [7, 8, 9, 10]}

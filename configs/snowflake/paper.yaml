# Snowflake Sudoku (gen_data.py, orders 4-10), trained and evaluated on
# orders 4-8; the SnowflakeExperiment defaults.
# Grid shape and operator vocab / augmentation are fixed by the config class.
name: paper

model:
  dim: 128
  num_layers: 4
  n_heads: 4
  n_loops: 16
  cls_token: true
  use_rope: false

data:
  n_puzzles: 500
  train_orders: [4, 5, 6, 7, 8]
  translate_aug: true
  constraint_group_embed: false
  seed: 42

train:
  steps: 1000
  batch_size: 512
  lr: 0.003
  weight_decay: 0.1
  seed: 0
  bce_pos_mult: 4.0
  bce_neg_mult: 0.5
  softmax_loss_weight: 0.2
  conflict_loss_weight: 0.1
  step:
    threshold: 0.10
    cls_threshold: 0.5
    temp_decide: 1.5
    augment: true

solve:
  step:
    threshold: 0.10
    cls_threshold: 0.6
    temp_decide: 1.5
    augment: true
  max_rounds: 1000
  n_chains: 64
  batch_size: 512

eval:
  index_list: snowflake_test
  index_filter: {orders: [4, 5, 6, 7, 8]}
  stop: full
  dropout_p: 0.05
  workers: 8

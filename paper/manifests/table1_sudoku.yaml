# Table 1: Sudoku-Extreme, LDT rows (no per-step augmentation in training,
# per-step augmentation at evaluation). The 4K and 8K rows are evaluated on
# every test puzzle; the 4K seeds 0-2 are also portfolio models
# (portfolio.yaml trains the same config, so the checkpoints are shared).
exp_id: M1
benchmark: sudoku
config: configs/sudoku/paper.yaml
eval: sequential
seeds: [0, 1, 2]
entries:
  - name: steps1k_train_noaug
    label: "LDT, 1K steps"
    set: {train.steps: 1000}
  - name: steps2k_train_noaug
    label: "LDT, 2K steps"
    set: {train.steps: 2000}
  - name: steps4k_train_noaug
    label: "LDT, 4K steps"
    eval: full
  # Trained separately so the full-split evals can be queued one at a time.
  - name: steps8k_train_noaug_ckpt
    train_only: true
    set: {train.steps: 8000}
  - name: steps8k_train_noaug
    label: "LDT, 8K steps"
    eval_of: steps8k_train_noaug_ckpt
    eval: full
  # 1,000 puzzles with no data or per-step augmentation, in training or at
  # evaluation.
  - name: noaug4k
    label: "LDT, 4K steps, no augmentation"
    set:
      data.augment_digit_perm: false
      data.augment_dihedral: false
      solve.step.augment: false
  # The same checkpoints with per-step augmentation at evaluation.
  - name: noaug4k_evalaug
    label: "LDT, 4K steps, no train aug., per-step aug. at eval"
    eval_of: noaug4k
    set: {solve.step.augment: true}
  # The whole train split (sudoku_val held out), no data augmentation in training.
  - name: fullsplit_noaug_4k_ckpt
    train_only: true
    set: {data.n_puzzles: null, data.augment_digit_perm: false, data.augment_dihedral: false}
  - name: fullsplit_noaug_4k
    label: "LDT, full train split, no train aug., 4K steps"
    eval_of: fullsplit_noaug_4k_ckpt
    eval: full

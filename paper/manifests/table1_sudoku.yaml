# Table 1: Sudoku-Extreme, LDT rows. The 4K-step rows are evaluated on every
# test puzzle; their seeds 0-2 are also the portfolio anchors (portfolio.yaml
# trains the same config, so the checkpoints are shared).
exp_id: M1
benchmark: sudoku
config: configs/sudoku/paper.yaml
eval: sequential
seeds: [0, 1, 2]
entries:
  - name: steps1k
    label: "LDT, 1K steps"
    set: {train.steps: 1000}
  - name: steps2k
    label: "LDT, 2K steps"
    set: {train.steps: 2000}
  - name: steps4k
    label: "LDT, 4K steps"
    eval: full
  # The same rows without per-step augmentation in training (kept at
  # evaluation): reported alongside, as phase 1 left it undecided for Sudoku.
  - name: steps1k_train_noaug
    label: "LDT, 1K steps, no per-step aug. in training"
    set: {train.steps: 1000, train.step.augment: false}
  - name: steps2k_train_noaug
    label: "LDT, 2K steps, no per-step aug. in training"
    set: {train.steps: 2000, train.step.augment: false}
  - name: steps4k_train_noaug
    label: "LDT, 4K steps, no per-step aug. in training"
    eval: full
    set: {train.step.augment: false}
  - name: noaug4k
    label: "LDT, 4K steps, no augmentation"
    set:
      data.augment_digit_perm: false
      data.augment_dihedral: false
      train.step.augment: false
      solve.step.augment: false
  # Without per-step augmentation, argmax digits leave eval dropout as the only
  # source of chain diversity; sampled digits restore it.
  - name: noaug4k_sample
    label: "LDT, 4K steps, no augmentation, sampled digits"
    eval_of: noaug4k
    set: {solve.step.digit_policy: sample}

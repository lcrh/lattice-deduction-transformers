# Phase 1, search: cell x digit policy at evaluation, on a 2K-
# and a 1K-step model. Scored on sudoku_val (held-out train puzzles), never
# on test. Selection rule: zero wrong answers, then accuracy, then fewest
# calls/solve, then the simpler option.
exp_id: P1
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: select
seeds: [0, 1, 2]
entries:
  - name: base2k
  - name: base1k
    set: {train.steps: 1000}
  - name: policy_2k
    eval_of: base2k
    grid:
      solve.step.cell_policy: [uniform, mrv, min_entropy, max_entropy]
      solve.step.digit_policy: [sample, argmax, rank_k]
  - name: policy_1k
    eval_of: base1k
    grid:
      solve.step.cell_policy: [uniform, mrv, min_entropy, max_entropy]
      solve.step.digit_policy: [sample, argmax, rank_k]

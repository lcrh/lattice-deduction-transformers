# Phase 1, confirmation: the top 2-3 candidate recipes from P1-P5 at 4K steps,
# on sudoku_val; `current` is the current default recipe for comparison.
exp_id: P6
benchmark: sudoku
config: configs/sudoku/paper.yaml
eval: select
seeds: [0, 1, 2]
# Phase 1 ran before argmax digits became the eval default; keep its runs as run.
set: {solve.step.digit_policy: sample, train.step.augment: true}
entries:
  - name: current
  - name: argmax
    eval_of: current
    set: {solve.step.digit_policy: argmax}
  - name: ce05_argmax
    set: {train.softmax_loss_weight: 0.5, solve.step.digit_policy: argmax}
  - name: ce10_argmax
    set: {train.softmax_loss_weight: 1.0, solve.step.digit_policy: argmax}

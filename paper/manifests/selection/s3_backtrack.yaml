# Phase 1, search: where a chain restarts after a conflict, with and without
# eliminating the candidate it returns to, on a 2K- and a 1K-step model.
exp_id: S3
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: select
seeds: [0, 1, 2]
entries:
  - name: base2k
  - name: base1k
    set: {train.steps: 1000}
  - name: backtrack_2k
    eval_of: base2k
    grid:
      solve.backtrack: [last, geometric, uniform_depth]
      solve.backtrack_negate: [false, true]
  - name: backtrack_1k
    eval_of: base1k
    grid:
      solve.backtrack: [last, geometric, uniform_depth]
      solve.backtrack_negate: [false, true]

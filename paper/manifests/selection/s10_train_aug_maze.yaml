# Phase 1, follow-up: per-step augmentation off in training (kept at
# evaluation) on 15x15 synthetic mazes, K=1 (the Figure 3 setup). Scored on
# the K-sweep's synthetic eval pool, which has no separate validation split.
exp_id: P10
benchmark: maze
config: configs/maze/ksweep.yaml
eval: whole
seeds: [0, 1, 2]
entries:
  - name: default
  - name: train_noaug
    set: {train.step.augment: false}

# Snowflake: combine and scale the P11 winners (constraint-group inputs plus
# more steps / puzzles), aiming for zero wrong answers on the validation
# split (orders 4-8).
exp_id: P12
benchmark: snowflake
config: configs/snowflake/paper.yaml
eval: whole
seeds: [0, 1, 2]
set: {eval.index_list: snowflake_val, data.constraint_group_embed: true}
entries:
  - name: group_4k
    set: {train.steps: 4000}
  - name: group_8k
    set: {train.steps: 8000}
  - name: group_8k_2kp
    set: {train.steps: 8000, data.n_puzzles: 2000}
  - name: group_16k_5kp
    set: {train.steps: 16000, data.n_puzzles: 5000}

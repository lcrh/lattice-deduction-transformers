# Phase 1, search: does training with the eval digit policy matter? 2x2 of
# training policy x evaluation policy, on sudoku_val.
exp_id: P2
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: select
seeds: [0, 1, 2]
# Phase 1 ran before argmax digits became the eval default; keep its runs as run.
set: {solve.step.digit_policy: sample}
entries:
  - name: train_sample
  - name: train_argmax
    set: {train.step.digit_policy: argmax}
  - name: train_sample_eval_argmax
    eval_of: train_sample
    set: {solve.step.digit_policy: argmax}
  - name: train_argmax_eval_argmax
    eval_of: train_argmax
    set: {solve.step.digit_policy: argmax}

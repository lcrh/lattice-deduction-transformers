# Phase 1, training losses: lambda_CE and the BCE positive/negative ratio
# (default 4.0/0.5 = 8x), on sudoku_val.
exp_id: P5
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: select
seeds: [0, 1, 2]
entries:
  - name: base2k
  - name: lambda_ce
    sweep: {train.softmax_loss_weight: [0.5, 1.0]}
  - name: ratio
    sweep: {train.bce_pos_mult: [2.0, 8.0]}

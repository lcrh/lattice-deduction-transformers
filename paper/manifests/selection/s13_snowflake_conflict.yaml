# Snowflake: the conflict head on the strong P12 recipes. The two remaining
# wrong answers (order 8) are complete grids after round 0 that the conflict
# head let through. Eval-only conflict thresholds on the P12 checkpoints, and
# training-side conflict-loss weight / BCE asymmetry at 8K steps, 2K puzzles.
exp_id: P13
benchmark: snowflake
config: configs/snowflake/paper.yaml
eval: whole
seeds: [0, 1, 2]
# Pins the pre-P13 defaults that entries do not override.
set: {eval.index_list: snowflake_val, data.constraint_group_embed: true, data.n_puzzles: 500, train.steps: 1000}
entries:
  - name: g8k_2kp
    set: {train.steps: 8000, data.n_puzzles: 2000}
  - name: g16k_5kp
    set: {train.steps: 16000, data.n_puzzles: 5000}
  - name: g8k_2kp_cls
    eval_of: g8k_2kp
    sweep: {solve.step.cls_threshold: [0.5, 0.4, 0.3]}
  - name: g16k_5kp_cls
    eval_of: g16k_5kp
    sweep: {solve.step.cls_threshold: [0.5, 0.4, 0.3]}
  - name: g8k_2kp_conflict
    set: {train.steps: 8000, data.n_puzzles: 2000}
    sweep: {train.conflict_loss_weight: [0.3, 1.0]}
  - name: g8k_2kp_ratio32
    set: {train.steps: 8000, data.n_puzzles: 2000, train.bce_pos_mult: 16.0}

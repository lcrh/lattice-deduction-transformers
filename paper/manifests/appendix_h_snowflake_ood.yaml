# Appendix H: Snowflake order transfer (varied-topology generator): train on
# small orders, test on larger ones, with and without a few higher-order
# training puzzles mixed in. One consolidated table with per-order columns.
exp_id: H1
benchmark: snowflake
eval: whole
seeds: [0, 1, 2]
table:
  per_order: [7, 8, 9, 10]
entries:
  - name: train4to6
    label: "Train orders 4-6 (no mix-in)"
    config: configs/snowflake/ood_4to6_eval7to10.yaml
  - name: mixin12
    label: "4-6 + 12 puzzles of orders 7-10"
    config: configs/snowflake/ood_4to6_mixin12.yaml
  - name: mixin25
    label: "4-6 + 25 puzzles of orders 7-10"
    config: configs/snowflake/ood_4to6_mixin25.yaml
  - name: mixin50
    label: "4-6 + 50 puzzles of orders 7-10"
    config: configs/snowflake/ood_4to6_mixin50.yaml
  - name: train6to8
    label: "Train orders 6-8, test 9-10"
    config: configs/snowflake/ood_6to8_eval9to10.yaml

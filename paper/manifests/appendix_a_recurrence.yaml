# Appendix A: is recurrence needed? One-factor deviations from the 2K-step
# default (configs/sudoku/ablation.yaml), each scored on the same first 1,000
# test puzzles. Arms with 4x compute or the full training split use 2 seeds.
exp_id: A1
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: ablation
seeds: [0, 1, 2]
table:
  reference: default
  groups:
    loops: "Loop count (about 800K parameters)"
    shapes: "Non-recurrent shapes, matched parameters"
    bigger: "Larger non-recurrent models"
    escalation: "More compute or data for few loops"
entries:
  - name: default
    label: "4 layers x 16 loops (default)"
    group: loops
  - name: loops
    group: loops
    sweep: {model.n_loops: [1, 2, 4, 8, 32]}
  - name: shape8x92
    label: "8 layers x 92, 1 loop"
    group: shapes
    set: {model.n_loops: 1, model.num_layers: 8, model.dim: 92}
  - name: shape16x64
    label: "16 layers x 64, 1 loop"
    group: shapes
    set: {model.n_loops: 1, model.num_layers: 16, model.dim: 64}
  - name: shape32x44
    label: "32 layers x 44, 1 loop"
    group: shapes
    set: {model.n_loops: 1, model.num_layers: 32, model.dim: 44}
  - name: untied8
    label: "8 layers x 128, 1 loop, 16K steps"
    group: bigger
    set: {model.n_loops: 1, model.num_layers: 8, train.steps: 16000}
  - name: untied16
    label: "16 layers x 128, 1 loop, 8K steps"
    group: bigger
    set: {model.n_loops: 1, model.num_layers: 16, train.steps: 8000}
  - name: wide
    label: "4 layers x 256, 1 loop, 8K steps"
    group: bigger
    set: {model.n_loops: 1, model.dim: 256, train.steps: 8000}
  - name: untied16_max
    label: "16 layers x 128, 1 loop, 32K steps, full train split"
    group: bigger
    seeds: [0, 1]
    set: {model.n_loops: 1, model.num_layers: 16, train.steps: 32000, data.n_puzzles: null}
  - name: l2_cm
    label: "2 loops, 16K steps (matched training FLOPs)"
    group: escalation
    set: {model.n_loops: 2, train.steps: 16000}
  - name: l1_cm
    label: "1 loop, 32K steps (matched training FLOPs)"
    group: escalation
    set: {model.n_loops: 1, train.steps: 32000}
  - name: l1_cm4x
    label: "1 loop, 128K steps (4x training FLOPs)"
    group: escalation
    seeds: [0, 1]
    set: {model.n_loops: 1, train.steps: 128000}
  - name: l1_bigdata
    label: "1 loop, 128K steps, full train split"
    group: escalation
    seeds: [0, 1]
    set: {model.n_loops: 1, train.steps: 128000, data.n_puzzles: null}

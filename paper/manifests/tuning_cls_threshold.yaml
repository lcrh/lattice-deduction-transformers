# Conflict threshold theta_CLS at evaluation, tuned on held-out train puzzles
# (`select` preset, sudoku_val), never on the test split: the 2K-step
# ablation model at the default 0.6 and at 0.5, 0.7 and 0.8. Selection rule:
# zero wrong answers, then accuracy, then fewest calls per solve.
exp_id: P4
benchmark: sudoku
config: configs/sudoku/ablation.yaml
eval: select
seeds: [0, 1, 2]
# These runs sample the branching digit from the candidate scores.
set: {solve.step.digit_policy: sample}
entries:
  - name: base2k
    label: "theta_CLS = 0.6"
    x: 0.6
  - name: cls
    eval_of: base2k
    sweep: {solve.step.cls_threshold: [0.5, 0.7, 0.8]}

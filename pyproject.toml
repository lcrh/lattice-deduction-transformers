[project]
name = "lattice-deduction-transformers"
version = "0.1.0"
description = "Reproduction code for Lattice Deduction Transformers (arXiv:2605.08605)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Liam Davis" },
    { name = "Leopold Haller", email = "leo@axiommath.ai" },
    { name = "Alberto Alfarano" },
    { name = "Mark Santolucito" },
]
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=4.5.0",
    "huggingface_hub>=0.20",
    "matplotlib>=3.10.9",
    "modal>=1.3.3",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
    "pyarrow>=23.0.1",
    "torch>=2.0.0",
    "torchvision>=0.27.0",
    "transformers>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the implemented followups subpackages are vendored — the other
# followups/ subdirs are doc-only (README design skeletons, no __init__.py)
# and are intentionally excluded. `followups` itself carries _common.py.
packages = [
    "src/lattice_diffusion",
    "experiments",
    "followups",
    "followups/arch_ablation",
    "followups/ood_snowflake",
    "followups/deduction_operator",
    "followups/search_process",
]
